
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101010">
<title>Sauce Giver — Find Your Sauce</title>

<style>
:root {
  --bg: #101010;
  --card: #191919;
  --text: #f5f5f5;
  --muted: #999;
  --accent: #c8fff5;
  --border: rgba(255,255,255,.12);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
}

/* Background video */

.background-video {
  position: fixed;
  inset: 0;
  z-index: -2;
  overflow: hidden;
  background: #101010;
}

.background-video video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: .30;
}

.background-overlay {
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background: linear-gradient(
    to bottom,
    rgba(16,16,16,.45),
    rgba(16,16,16,.88) 40%,
    #101010 85%
  );
}

/* Navigation */

header {
  width: 100%;
  padding: 24px 7%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--border);
}

.logo {
  font-size: 19px;
  font-weight: 800;
  letter-spacing: -1px;
}

.logo span {
  color: var(--accent);
}

nav a {
  text-decoration: none;
  color: var(--text);
  font-size: 13px;
  margin-left: 22px;
  opacity: .8;
}

nav a:hover {
  opacity: 1;
}

/* Hero */

.hero {
  min-height: 390px;
  padding: 100px 7% 85px;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: center;
}

.eyebrow {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 3px;
  color: var(--accent);
  margin-bottom: 22px;
}

.hero h1 {
  font-size: clamp(48px, 9vw, 100px);
  line-height: .95;
  letter-spacing: -6px;
  font-weight: 800;
  max-width: 850px;
}

.hero h1 span {
  color: var(--accent);
}

.hero p {
  max-width: 430px;
  margin-top: 25px;
  color: #c1c1c1;
  font-size: 15px;
}

/* Main section */

main {
  padding: 0 7% 90px;
}

.section-heading {
  display: flex;
  justify-content: space-between;
  align-items: end;
  gap: 15px;
  margin-bottom: 28px;
}

.section-heading h2 {
  font-size: 27px;
  letter-spacing: -1px;
}

.section-heading p {
  font-size: 12px;
  color: var(--muted);
}

.sauce-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

.sauce-card {
  min-width: 0;
  min-height: 145px;
  padding: 23px;
  background: rgba(25,25,25,.85);
  border: 1px solid var(--border);
  border-radius: 5px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 20px;
  transition: border-color .2s, transform .2s;
}

.sauce-card:hover {
  border-color: rgba(200,255,69,.6);
  transform: translateY(-2px);
}

.card-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.card-number {
  font-size: 11px;
  color: var(--muted);
  letter-spacing: 1px;
}

.status {
  font-size: 10px;
  color: var(--accent);
  border: 1px solid rgba(200,255,69,.3);
  padding: 4px 7px;
  border-radius: 3px;
}

.sauce-card h3 {
  font-size: 19px;
  letter-spacing: -.5px;
  overflow-wrap: anywhere;
}

.sauce-card p {
  font-size: 12px;
  color: var(--muted);
  margin-top: 5px;
}

.watch {
  display: inline-flex;
  justify-content: center;
  align-items: center;
  align-self: flex-start;
  gap: 10px;
  padding: 10px 17px;
  background: var(--accent);
  color: #111;
  text-decoration: none;
  font-size: 12px;
  font-weight: 800;
  border-radius: 3px;
  transition: background .2s;
}

.watch:hover {
  background: #e0ff91;
}

.watch.disabled {
  background: #333;
  color: #888;
  cursor: not-allowed;
}

/* Footer */

footer {
  padding: 25px 7%;
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  gap: 15px;
  flex-wrap: wrap;
  color: var(--muted);
  font-size: 11px;
}

footer a {
  color: var(--text);
  text-decoration: none;
}

/* Responsive */

@media (min-width: 900px) {
  .sauce-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

@media (min-width: 1250px) {
  .sauce-grid {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
}

@media (max-width: 550px) {
  header {
    padding: 20px 5%;
  }

  nav a {
    margin-left: 12px;
    font-size: 11px;
  }

  .hero {
    min-height: 350px;
    padding: 80px 5%;
  }

  .hero h1 {
    letter-spacing: -3px;
  }

  main {
    padding: 0 5% 60px;
  }

  .sauce-grid {
    grid-template-columns: 1fr;
  }

  .sauce-card {
    min-height: 135px;
  }

  .section-heading h2 {
    font-size: 23px;
  }
}
</style>
</head>
